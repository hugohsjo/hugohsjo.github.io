baseURL = "https://hugojo.com/"
languageCode = "ko-kr"
title = "휴고조 Hugo Jo"
theme = "PaperMod"
timeZone = "Asia/Seoul"
enableRobotsTXT = true

[pagination]
pagerSize = 10

[outputs]
home = ["HTML", "RSS", "JSON"]

[params]
description = "기술은 수단, 목적은 언제나 삶. 삶의 질을 높이는 것을 만드는 과정의 기술 기록."
defaultTheme = "auto"
ShowReadingTime = true
ShowBreadCrumbs = true
ShowPostNavLinks = true
ShowCodeCopyButtons = true
ShowRssButtonInSectionTermList = true

[params.assets]
favicon = "favicon-32.png"
apple_touch_icon = "apple-touch-icon.png"

[params.homeInfoParams]
Title = "휴고조 Hugo Jo"
Content = "기술은 수단입니다. 목적은 언제나 삶입니다. 삶의 질을 높이는 것을, 오늘도 만듭니다."

